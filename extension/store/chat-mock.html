<!doctype html>
<html><head><meta charset="utf-8"><title>AI chat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; font: 15px/1.6 ui-sans-serif, -apple-system, 'Segoe UI', sans-serif; color: #292524; background: #fbfaf8; display: flex; flex-direction: column; }
  header { height: 52px; display: flex; align-items: center; padding: 0 20px; gap: 10px; border-bottom: 1px solid #eeebe7; color: #57534e; font-size: 14px; }
  header .dot { width: 22px; height: 22px; border-radius: 6px; background: #d6d3d1; }
  .thread { flex: 1; overflow: hidden; max-width: 680px; width: 100%; margin: 0 auto; padding: 28px 24px 0; }
  .msg { margin: 0 0 22px; }
  .user { margin-left: auto; max-width: 80%; width: fit-content; background: #efece8; padding: 10px 14px; border-radius: 14px; }
  .bot p { margin: 0 0 10px; }
  .bot code { font: 13px ui-monospace, Menlo, monospace; background: #f1efec; padding: 1px 5px; border-radius: 4px; }
  .composer { max-width: 680px; width: calc(100% - 48px); margin: 0 auto 24px; background: #fff; border: 1px solid #e3dfda; border-radius: 18px; box-shadow: 0 2px 10px rgba(28,25,23,.05); padding: 14px 16px 10px; }
  #editor .ProseMirror { outline: none; min-height: 48px; font-size: 15px; }
  #editor .ProseMirror p { margin: 0; }
  .tools { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: #a8a29e; font-size: 13px; }
  .send { width: 32px; height: 32px; border-radius: 10px; background: #44403c; }
  @media (prefers-color-scheme: dark) {
    body { background: #1f1d1b; color: #e7e5e4; }
    header { border-color: #2e2b28; color: #a8a29e; } header .dot { background: #44403c; }
    .user { background: #2e2b28; } .bot code { background: #2e2b28; }
    .composer { background: #292524; border-color: #3a3632; } .send { background: #d6d3d1; }
  }
</style></head>
<body>
  <header><span class="dot"></span>Refactoring the billing service</header>
  <div class="thread">
    <div class="msg user">Can you help me tidy up <code>invoice.ts</code> before I open the PR?</div>
    <div class="msg bot"><p>Of course. Paste the file and tell me what kind of review you want — style, correctness, or security — and I'll go through it section by section.</p></div>
  </div>
  <div class="composer"><div id="editor"></div><div class="tools"><span>Attach · Tools</span><span class="send"></span></div></div>
  <script src="https://claude.ai/__fixtures/pm.js"></script>
</body></html>
