name: Test

on:
  push:
    branches:
      - main
      - '001-prompt-platform'
      - 'server-database-migration'
  pull_request:
    branches:
      - main
      - '001-prompt-platform'
      - 'server-database-migration'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 24.x]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prompt_saver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run migrations
        run: npm run db:migrate
        env:
          DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/prompt_saver_test

      - name: Test
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prompt_saver_test
          DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/prompt_saver_test
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prompt_saver_test
          DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/prompt_saver_test
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000
